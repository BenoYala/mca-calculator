<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Cash Advance APR Calculator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background-color: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #34d399; text-align: center; font-size: 24px; margin-bottom: 5px; }
        p.sub { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 16px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #34d399; }
        .results { margin-top: 25px; padding: 20px; background-color: #0f172a; border-radius: 8px; border: 1px solid #334155; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; }
        .result-row:last-child { margin-bottom: 0; border-top: 1px solid #334155; padding-top: 10px; margin-top: 10px; }
        .val { font-weight: bold; }
        .red { color: #f87171; }
        .yellow { color: #fbbf24; }
        .white { color: #ffffff; }
    </style>
</head>
<body>

<div class="container">
    <h1>True MCA APR Calculator</h1>
    <p class="sub">Find the hidden cost of your Merchant Cash Advance.</p>

    <div class="input-group">
        <label>Funding Amount ($)</label>
        <input type="number" id="amount" value="50000" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>Factor Rate (e.g., 1.3)</label>
        <input type="number" step="0.01" id="factor" value="1.3" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>Term Length (Months)</label>
        <input type="number" id="term" value="6" oninput="calculate()">
    </div>

    <div class="results">
        <div class="result-row">
            <span>Total Payback:</span>
            <span class="val white" id="payback">$0</span>
        </div>
        <div class="result-row">
            <span>Total Cost (Fees):</span>
            <span class="val red" id="cost">$0</span>
        </div>
        <div class="result-row">
            <span>Est. Daily Payment:</span>
            <span class="val white" id="daily">$0</span>
        </div>
        <div class="result-row">
            <span>Estimated APR:</span>
            <span class="val yellow" id="apr">0%</span>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const factor = parseFloat(document.getElementById('factor').value) || 1;
        const term = parseFloat(document.getElementById('term').value) || 1;

        const payback = amount * factor;
        const cost = payback - amount;
        const monthlyRate = (cost / amount) / term;
        const apr = monthlyRate * 12 * 100;
        const daily = (payback / term) / 22; // ~22 business days a month

        // Форматирование валюты
        const format = (num) => "$" + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        document.getElementById('payback').textContent = format(payback);
        document.getElementById('cost').textContent = format(cost);
        document.getElementById('daily').textContent = format(daily);
        document.getElementById('apr').textContent = apr.toFixed(1) + "%";
    }

    // Инициализация при загрузке
    calculate();
</script>

</body>
</html>
